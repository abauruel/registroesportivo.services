services:
  redis:
    image: redis:7
    container_name: redis_edge
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  producer:
    build: .
    image: registroesportivoservices-app:latest
    container_name: event_producer
    command: python services/producer_service.py
    ports:
      - "5001:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - NVR_IP=${NVR_IP}
      - NVR_PORT=${NVR_PORT}
      - NVR_USERNAME=${NVR_USERNAME}
      - NVR_PASSWORD=${NVR_PASSWORD}
    privileged: true # necessário para GPIO
    devices:
      - /dev/gpiomem
    depends_on:
      - redis
    restart: always

  worker_download:
    image: registroesportivoservices-app:latest
    container_name: worker_download
    command: rq worker download_queue
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - NVR_IP=${NVR_IP}
      - NVR_PORT=${NVR_PORT}
      - NVR_USERNAME=${NVR_USERNAME}
      - NVR_PASSWORD=${NVR_PASSWORD}
    volumes:
      - videos_data:/videos

    depends_on:
      - redis
    restart: always

  worker_upload:
    image: registroesportivoservices-app:latest
    container_name: worker_upload
    command: rq worker upload_queue
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - videos_data:/videos
    depends_on:
      - redis
    restart: always

volumes:
  redis_data:
  videos_data:
